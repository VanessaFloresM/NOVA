<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Exitosa - NOVA</title>
    <link rel="stylesheet" href="estilos-colección.css">
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 20px;
        }
        
        .success-box {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .success-box h1 {
            color: #10b981;
            margin-bottom: 15px;
        }
        
        .success-box p {
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn-home {
            display: inline-block;
            padding: 15px 40px;
            background: #800020;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-home:hover {
            background: #5B2432;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-box">
            <div class="success-icon">✅</div>
            <h1>¡Pago Exitoso!</h1>
            <p>Tu pedido ha sido procesado correctamente. Recibirás un correo de confirmación con los detalles de tu compra.</p>
            <p><strong>¡Gracias por tu compra!</strong></p>
            <a href="inicio.html" class="btn-home">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
