  <div class="contenedor-formulario">
    <h1>Contáctanos</h1>
    <p>¿Tienes alguna duda, sugerencia o quieres cotizar un mueble personalizado? Escríbenos:</p>
    <form>
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required />
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required />
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="55 1234 5678" />
      </div>
      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>
      <div class="form-buttons">
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
      </div>
    </form>
  </div>
